name: CI/CD Workflow

on:
  push:
    branches: [main]
    paths: ["backend/**"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
      -
        name: Build image
        run: |
          cd backend
          podman build --build-arg APP_UID=$(id -u) --build-arg APP_GID=$(id -g) -t emergency-location .
          podman tag emergency-location docker.io/${{ vars.DOCKERHUB_USERNAME }}/emergency-location:latest
      -
        name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Push image
        run: podman push docker.io/${{ vars.DOCKERHUB_USERNAME }}/emergency-location:latest
      -
        name: Copy compose.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH }}
          port: 22
          source: "backend/compose.yml"
          target: "/app"
          strip_components: 1
      -
        name: Start up the backend and the database
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          port: 22
          script: |
            cd /app
            podman rm -f ${{ vars.BACKEND_CNT_NAME }}
            podman rmi ${{ vars.BACKEND_IMAGE }}
            podman-compose --env-file=env/.env up -d