[project]
name = "emergency-location"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "fastapi>=0.139.2",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "phonenumbers>=9.0.34",
    "pydantic-settings>=2.14.2",
    "sqlalchemy[asyncio]>=2.0.51",
    "twilio>=9.10.9",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "ruff>=0.15.22",
]

[tool.mypy]
explicit_package_bases = true
strict = true
python_version = '3.13'
exclude= [
    'sms_test\.py',
    'wa_test\.py'
]
[[tool.mypy.overrides]]
module = "twilio.*"
ignore_missing_imports = true